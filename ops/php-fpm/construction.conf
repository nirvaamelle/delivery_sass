; PHP-FPM pool — P6-07.
;
; Install as /etc/php/8.3/fpm/pool.d/construction.conf, remove or disable the
; default www.conf pool, then `php-fpm8.3 -t` BEFORE `systemctl reload php8.3-fpm`.
;
; Sized for the Part D item 12 box — Hetzner CX22, 2 vCPU and 4 GB — sharing it
; with MySQL (1 GB buffer pool) and Redis. PLACEHOLDER: resize once the real
; server exists and a week of `pm.status_path` numbers are in hand.

[construction]
; Its own user, not www-data. A compromised request then owns this application's
; files and nothing else on the box.
user = construction
group = www-data

listen = /run/php/php8.3-fpm-construction.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; ~60 MB per worker × 12 ≈ 720 MB. Past this, requests queue instead of the box
; swapping — and a swapping box is slower for everybody than a queue is.
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle each worker after 500 requests, so a slow memory leak in any
; dependency becomes a restart nobody notices rather than an outage at 4pm.
pm.max_requests = 500

; Web requests should be short. Anything long — the payroll run above all —
; is a queued job on a supervised worker, not a request held open in FPM
; (PLAN.md section 2). A request still running after a minute is a bug, and
; killing it frees the worker.
request_terminate_timeout = 60s

; Only .php files execute. An uploaded receipt.jpg containing PHP must not run.
security.limit_extensions = .php

; Never render an error to the browser. A rendered error carries the stack trace,
; and the stack trace carries the database credentials — the same reason
; APP_DEBUG is false. php_admin_* so the application cannot turn it back on.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm/construction-error.log

; expose_php is deliberately NOT set here. It is a system-level directive, and
; it lives in ops/php/99-construction.ini, where it is certain to take effect.

pm.status_path = /fpm-status
