; PHP settings for the construction ERP — P6-07.
;
; Install as /etc/php/8.3/fpm/conf.d/99-construction.ini (and the same under
; cli/conf.d, so queue workers and artisan run under the same rules as the web).
;
; System-level directives live here rather than in the FPM pool file, because a
; pool's php_admin_* is not a reliable place for every PHP_INI_SYSTEM directive.
; A setting in a conf.d file is certain to apply.

; Do not announce the PHP version in every response header. It tells a scanner
; which published vulnerabilities to try first.
expose_php = Off

; Belt and braces with the pool file: never render errors, always log them.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Sessions: cookies only, HTTP only, and never readable over plain HTTP.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; bcmath is what keeps DECIMAL(18,4) money exact (BUILD-STATE.md environment
; notes). opcache makes the rest affordable.
opcache.enable = 1
opcache.validate_timestamps = 0
; validate_timestamps = 0 means a deploy MUST reload PHP-FPM, or the old code
; keeps running. deploy.sh does; a hand-copied hotfix does not.
