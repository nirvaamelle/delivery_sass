# SSH hardening — P6-07.
#
# Install as /etc/ssh/sshd_config.d/00-construction.conf, then `sshd -t` to
# check the syntax BEFORE `systemctl reload ssh`. A broken sshd config followed
# by a reload is how a server locks out the only person who could fix it.
#
# Named 00-, not 99-, and the number is the point. sshd uses the FIRST value it
# reads for each keyword (sshd_config(5): "the first obtained value will be
# used"), and drop-ins are read in alphabetical order. A provider's cloud-init
# drop-in — commonly 50-cloud-init.conf, setting `PasswordAuthentication yes` —
# would win over a file named 99-anything, and the server would keep accepting
# passwords while this file appeared to forbid them.
#
# Before applying: confirm a key-based login works in a SECOND session, and
# keep the first session open until it does.

# Nobody logs in as root. Administration is a named user plus sudo, so the
# audit trail says who.
PermitRootLogin no

# Keys only. With passwords off there is nothing for a brute-force attempt to
# guess, which makes fail2ban a second line of defence rather than the first.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Three attempts per connection, and thirty seconds to authenticate.
MaxAuthTries 3
LoginGraceTime 30

# Nothing this server does needs forwarding, and each one is a tunnel through
# the firewall for whoever holds a key.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Drop abandoned sessions after ten minutes.
ClientAliveInterval 300
ClientAliveCountMax 2

# Restrict logins to an explicit group once it exists. Left commented because
# enabling it before `sshusers` is created and populated locks everybody out —
# do that step deliberately, from a second session.
# AllowGroups sshusers
